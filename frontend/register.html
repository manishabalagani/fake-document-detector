<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | DocAnalyzer</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            DocAnalyzer
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#features">Features</a>
            <a href="index.html#how-it-works">How It Works</a>
        </nav>
        <button
    type="button"
    class="theme-toggle"
    id="themeToggle"
    aria-label="Toggle dark mode"
>
    🌙
</button>

    </header>


    <!-- Register Section -->
    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    👤
                </div>

                <h1>
                    Create Account
                </h1>

                <p>
                    Create an account to start analyzing documents.
                </p>

            </div>


            <form id="registerForm">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Error -->
                <div
                    id="registerError"
                    class="form-error"
                    aria-live="polite"
                ></div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="btn btn-primary auth-button"
                >
                    Create Account
                </button>

            </form>


            <!-- Login -->
            <div class="auth-footer">

                <p>
                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 Document Analyzer. All rights reserved.
        </p>

    </footer>

    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
    <script src="js/theme.js"></script>


</body>

</html>
