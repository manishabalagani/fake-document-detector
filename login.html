<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | DocAnalyzer</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================== -->
    <header class="navbar">

        <div class="logo">
            DocAnalyzer
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#features">Features</a>
            <a href="index.html#how-it-works">How It Works</a>
        </nav>

        <!-- Dark Mode Toggle -->
        <button
            type="button"
            class="theme-toggle"
            id="themeToggle"
            aria-label="Toggle dark mode"
            title="Toggle dark mode"
        >
            🌙
        </button>

    </header>


    <!-- =========================
         LOGIN SECTION
    ========================== -->
    <main class="auth-page">

        <div class="auth-card">

            <!-- Header -->
            <div class="auth-header">
             <div class="auth-icon" aria-label="DocAnalyzer">
    <img
        src="images/favicon.png"
        alt="DocAnalyzer Logo"
        class="auth-favicon"
    >
            </div>

                <h1>Welcome Back</h1>

                <p>
                    Sign in to continue to Document Analyzer.
                </p>

            </div>


            <!-- =========================
                 LOGIN FORM
            ========================== -->
            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-with-icon">

                        <span
                            class="input-icon"
                            aria-hidden="true"
                        >

                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <rect
                                    x="3"
                                    y="5"
                                    width="18"
                                    height="14"
                                    rx="2"
                                ></rect>

                                <path
                                    d="m3 7 9 6 9-6"
                                ></path>
                            </svg>

                        </span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-with-icon">

                        <span
                            class="input-icon"
                            aria-hidden="true"
                        >

                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <rect
                                    x="3"
                                    y="11"
                                    width="18"
                                    height="10"
                                    rx="2"
                                ></rect>

                                <path
                                    d="M7 11V7a5 5 0 0 1 10 0v4"
                                ></path>
                            </svg>

                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </div>


                <!-- Remember / Forgot Password -->
                <div class="form-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="remember"
                            name="remember"
                        >
 
                        <span>
                            Remember me
                        </span>

                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <!-- Error Message -->
                <div
                    id="loginError"
                    class="form-error"
                    aria-live="polite"
                ></div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="btn btn-primary auth-button"
                >
                    Login
                </button>

            </form>


            <!-- =========================
                 REGISTER
            ========================== -->
            <div class="auth-footer">

                <p>
                    Don't have an account?

                    <a href="register.html">
                        Create an account
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="footer">

        <p>
            © 2026 Document Analyzer. All rights reserved.
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="js/login.js"></script>
    <script src="js/theme.js"></script>

</body>
</html>
